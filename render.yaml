services:
  - type: web
    name: news-il
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APPROVAL_MODE
        value: "false"
      - key: ADMIN_CHAT_ID
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: INTERVAL_SECONDS
        value: "120"
      - key: MAX_ARTICLE_AGE_HOURS
        value: "3"
      - key: DB_PATH
        value: newsil.db
